<section class="home-hero" aria-labelledby="home-hero-title">
  <img
    class="home-hero__artwork"
    src="{{ '/images/landing-hero-supplied.png' | relative_url }}"
    alt=""
    width="1680"
    height="941"
    decoding="async"
    fetchpriority="high"
  >
  <div class="home-hero__inner">
    <div class="home-hero__copy">
      <h1 id="home-hero-title">{{ page.home_hero.title }}</h1>
      <p>{{ page.home_hero.tagline }}</p>
    </div>
  </div>
</section>
